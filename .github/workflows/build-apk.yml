name: Build Android APK & Bundle

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release Bundle (AAB)
        run: gradle :app:bundleRelease || true

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Talha-Mahmood-Portfolio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Talha-Mahmood-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
