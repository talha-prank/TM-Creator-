name: Build Android APK and Deploy Website

on:
  push:
    branches: [ "main", "**" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Website & Include APK
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/Talha-Mahmood-Portfolio.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Talha-Mahmood-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talha-Mahmood-Website-Docs
          path: docs/
          if-no-files-found: warn

  deploy-pages:
    name: Deploy Website to GitHub Pages
    needs: build-apk
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: Talha-Mahmood-App-APK
          path: apk_download/

      - name: Prepare Website Folder
        run: |
          mkdir -p docs
          if [ -f apk_download/app-debug.apk ]; then
            cp apk_download/app-debug.apk docs/Talha-Mahmood-Portfolio.apk
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
